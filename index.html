<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>价格核算系统 - 入口</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; background: linear-gradient(135deg, #1f3a5f 0%, #2c5282 100%); }
  .wrap { text-align: center; width: 100%; padding: 0 16px; }
  h1 { color: #fff; font-size: 26px; font-weight: 600; margin: 0 0 30px; letter-spacing: 2px; }
  a.card { display: block; width: 300px; margin: 0 auto 18px; background: #fff; border-radius: 12px; padding: 26px 20px; text-decoration: none; box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: transform .15s, box-shadow .15s; }
  a.card:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(0,0,0,.3); }
  a.card .t { font-size: 19px; font-weight: 600; color: #1f3a5f; margin-bottom: 6px; }
  a.card .d { font-size: 13px; color: #888; }
  .logout-btn { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 6px; padding: 8px 22px; font-size: 14px; cursor: pointer; margin-top: 6px; }
  .logout-btn:hover { background: rgba(255,255,255,.25); }
  /* 登录遮罩 */
  #gate { position: fixed; inset: 0; z-index: 9999; background: linear-gradient(135deg, #1f3a5f 0%, #2c5282 100%); display: flex; align-items: center; justify-content: center; }
  #gate .box { background: #fff; border-radius: 12px; padding: 32px 36px; width: 340px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  #gate .box h2 { text-align: center; margin: 0 0 6px; color: #1f3a5f; font-size: 22px; }
  #gate .box .sub { text-align: center; color: #999; font-size: 13px; margin-bottom: 22px; }
  #gate .box label { display: block; color: #555; font-size: 13px; margin: 12px 0 4px; text-align: left; }
  #gate .box input { width: 100%; border: 1px solid #ccd2da; border-radius: 6px; padding: 9px 12px; font-size: 15px; }
  #gate .box input:focus { outline: none; border-color: #1f3a5f; box-shadow: 0 0 0 3px rgba(31,58,95,.12); }
  #gate .box button { width: 100%; margin-top: 20px; background: #1f3a5f; color: #fff; border: 0; border-radius: 6px; padding: 11px; font-size: 15px; cursor: pointer; }
  #gate .box button:hover { background: #2c5282; }
  #gate .box .err { color: #d9534f; font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }
  #gate .box .remembered { color: #4a4; font-size: 12px; text-align: center; margin-top: 8px; }
  #gate .box .clear-link { display: block; color: #999; font-size: 12px; text-align: center; margin-top: 10px; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>价格核算系统</h2>
    <div class="sub">请登录后使用</div>
    <label>账号</label>
    <input type="text" id="gUser" autocomplete="off" placeholder="请输入账号">
    <label>密码</label>
    <input type="password" id="gPass" placeholder="请输入密码" onkeydown="if(event.key==='Enter')tryLogin()">
    <button onclick="tryLogin()">登录</button>
    <div class="err" id="gErr"></div>
    <span class="clear-link" id="gClear" style="display:none" onclick="clearRemember()">清除自动填入</span>
  </div>
</div>

<div class="wrap">
  <h1>莆田价格体系核算</h1>
  <a class="card" href="full.html">
    <div class="t">价格体系核算系统（完整版）</div>
    <div class="d">含成本、成本折扣、代理商利润</div>
  </a>
  <a class="card" href="dist.html">
    <div class="t">核算系统（分销渠道版）</div>
    <div class="d">面向分销渠道</div>
  </a>
  <button class="logout-btn" onclick="logout()">退出登录</button>
</div>

<script>
'use strict';
/* 凭证哈希：SHA-256("ptjg_2026::" + 账号 + "|" + 密码)。
   源码不含明文密码；如需修改密码，重新计算哈希并替换此值后重新部署，旧密码即失效。 */
var AUTH_HASH = '33ddfc0544885334837f49f23116709a72351a12aba0192411884e8619075dc3';
var SALT = 'ptjg_2026::';
var GATE_KEY = 'entry_gate_ok';      /* sessionStorage：本浏览器会话内保持登录，退出/关闭浏览器即失效 */
var REMEMBER_KEY = 'entry_remember'; /* localStorage：记住账号密码，自动填入登录框 */

async function sha256Hex(s) {
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
}

function lock() {
  document.getElementById('gate').style.display = 'flex';
  fillRemembered();
}
function unlock() { document.getElementById('gate').style.display = 'none'; }

function fillRemembered() {
  try {
    var r = JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null');
    if (r && r.u) {
      document.getElementById('gUser').value = r.u;
      document.getElementById('gPass').value = r.p || '';
      document.getElementById('gClear').style.display = 'block';
    }
  } catch (e) {}
}

function clearRemember() {
  localStorage.removeItem(REMEMBER_KEY);
  document.getElementById('gUser').value = '';
  document.getElementById('gPass').value = '';
  document.getElementById('gClear').style.display = 'none';
  document.getElementById('gErr').textContent = '';
}

function logout() {
  sessionStorage.removeItem(GATE_KEY);
  lock();
}

async function tryLogin() {
  var u = document.getElementById('gUser').value.trim();
  var p = document.getElementById('gPass').value;
  var h = await sha256Hex(SALT + u + '|' + p);
  if (h === AUTH_HASH) {
    localStorage.setItem(REMEMBER_KEY, JSON.stringify({ u: u, p: p }));
    sessionStorage.setItem(GATE_KEY, '1');
    document.getElementById('gErr').textContent = '';
    unlock();
  } else {
    document.getElementById('gErr').textContent = '账号或密码错误';
  }
}

(function init() {
  if (sessionStorage.getItem(GATE_KEY)) { unlock(); return; }
  lock();
})();
</script>
</body>
</html>

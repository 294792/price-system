<style>
  * { box-sizing: border-box; }

  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border: 1px solid #d9dee5; padding: 5px 8px; text-align: left; vertical-align: middle; }

  tr.total td { background: #f7f9fc; font-weight: 600; }
  tr.hl td { background: #fffbe6; font-weight: 600; }
  input[type=number], input[type=text] { border: 1px solid #ccd2da; border-radius: 3px; padding: 3px 5px; width: 90px; }
  td input[type=number] { width: 78px; text-align: right; }
  td input[type=text] { width: 100%; min-width: 70px; }
  select { max-width: 260px; }
  button { cursor: pointer; }
  .btn { background: #1f3a5f; color: #fff; border: 0; border-radius: 4px; padding: 6px 14px; font-size: 13px; }
  .btn.light { background: #eef1f5; color: #333; border: 1px solid #ccd2da; }
  .btn.danger { background: #d9534f; }
  .chip { display: inline-block; background: #eef1f5; border: 1px solid #ccd2da; color: #333; border-radius: 14px; padding: 4px 14px; margin: 0 6px 6px 0; cursor: pointer; font-size: 13px; }
  .chip.active { background: #1f3a5f; color: #fff; border-color: #1f3a5f; }
  .block-label { font-weight: 600; margin-right: 4px; color: #1f3a5f; }
  .order-title { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .order-title h3 { margin: 0; }
  .hint { color: #888; font-size: 12px; }
  .unmatched { background: #fff3f3; }
  tr.unmatched td { background: #fff3f3; }
  .book-wrap { overflow-x: auto; }
  .book-table { min-width: 2400px; }
  .book-table td { padding: 3px 4px; }
  .book-table thead th { position: sticky; top: 0; }
  .colgroup-price { background: #eaf3ff; }
  .colgroup-cost { background: #fff2e8; }
  .colgroup-welfare { background: #eefbea; }
  .x-btn { background: transparent; border: 0; color: #b33; font-weight: 700; margin-left: 4px; padding: 0 2px; }
  .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .saved { color: #4a4; font-size: 12px; margin-left: 8px; }
  @media print {

    .block { break-after: page; }
    .panel { border: none; box-shadow: none; padding: 0; margin-bottom: 14px; }
    input { border: none !important; }
  }

/* ---------- 基础工具 ---------- */
function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }
function esc(s) { return (s == null ? '' : '' + s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fmt2(x) { if (!isFinite(x)) x = 0; return x.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtQ(x) { if (!isFinite(x)) x = 0; return x.toLocaleString('zh-CN', { maximumFractionDigits: 2 }); }
function num(v) { var f = parseFloat(v); return isNaN(f) ? 0 : f; }

/* ---------- 状态 ---------- */
function loadState() {
  try {
    var raw = localStorage.getItem(LSKEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && s.products && s.orders && s.blocks) return s;
    }
  } catch (e) {}
  return deepCopy(SEED);
}
var state = loadState();
function save() { try { localStorage.setItem(LSKEY, JSON.stringify(state)); } catch (e) { alert('保存失败：浏览器存储空间不足'); } }

function migrate() {
  if (!state.view) state.view = {};
  var v = state.view;
  if (['orders', 'summary', 'books', 'data'].indexOf(v.tab) < 0) v.tab = 'orders';
  if (!v.order || !state.orders[v.order]) {
    var first = null;
    for (var k in state.orders) { if (!first) first = k; }
    v.order = first;
  }
  if (!v.priceCol || state.priceCols.indexOf(v.priceCol) < 0) v.priceCol = state.priceCols[0];
  if (!v.priceCol2 || state.priceCols.indexOf(v.priceCol2) < 0) v.priceCol2 = state.priceCols[1] || state.priceCols[0];
  delete v.costCol; delete v.welfareCol;
  if (!state.gparams) state.gparams = { ws1: '', rt1: '', ws2: '', rt2: '' };
  if (!state._v5Params) { /* 一次性升级：全局系数按列区分（列1/列2各自独立） */
    if (state.gparams.ws !== undefined) {
      if (!state.gparams.ws1) state.gparams.ws1 = state.gparams.ws;
      if (!state.gparams.rt1) state.gparams.rt1 = state.gparams.rt;
      delete state.gparams.ws; delete state.gparams.rt;
    }
    delete state.blockParams;
    state._v5Params = true;
  }
}

/* ---------- 商品索引 ---------- */
var _pIndex = null;
function invalidateIndex() { _pIndex = null; }
function pIndex() {
  if (_pIndex) return _pIndex;
  _pIndex = { exact: {}, fuzzy: {} };
  state.products.forEach(function (p) {
    _pIndex.exact[p.name + '|' + p.spec] = p;
    var fk = p.name + '|' + normSpec(p.spec);
    if (!_pIndex.fuzzy[fk]) _pIndex.fuzzy[fk] = p;
  });
  return _pIndex;
}
function normSpec(s) { return (s == null ? '' : '' + s).replace(/\s+/g, '').replace(/[ⅠⅡⅢ]/g, ''); }
function findProduct(name, spec) {
  if (!name) return null;
  var ix = pIndex();
  return ix.exact[name + '|' + spec] || ix.fuzzy[name + '|' + normSpec(spec)] || null;
}
function colIdx(cols, name) { var i = cols.indexOf(name); return i < 0 ? 0 : i; }
/* 系列归一：日丰白单面价/白色单层成本 → 同一系列 */
function seriesKey(name) {
  var s = (name || '').replace(/^日丰/, '');
  s = s.replace(/(面价|成本|卖价)$/g, '');
  if (s === '白单') s = '白色单层';
  return s;
}
function colForSeries(cols, priceCol) {
  var k = seriesKey(priceCol);
  for (var j = 0; j < cols.length; j++) { if (seriesKey(cols[j]) === k) return cols[j]; }
  return null;
}
/* 一列面价 → 自动匹配对应的成本列与水工福利列 */
function getSideCols(priceCol) {
  var cc = colForSeries(state.costCols, priceCol);
  var wc = colForSeries(state.welfareCols, priceCol);
  return {
    priceCol: priceCol,
    priceIdx: colIdx(state.priceCols, priceCol),
    costIdx: cc ? state.costCols.indexOf(cc) : -1,
    welfareIdx: wc ? state.welfareCols.indexOf(wc) : -1
  };
}
function priceOfAt(p, side) { return p ? (p.price[side.priceIdx] || 0) : 0; }
function costOfAt(p, side) { return (p && side.costIdx >= 0) ? (p.cost[side.costIdx] || 0) : 0; }
function welfareOfAt(p, side) { return (p && side.welfareIdx >= 0) ? (p.welfare[side.welfareIdx] || 0) : 0; }
function viewSide() { return getSideCols(state.view.priceCol); }
function priceOf(p) { return priceOfAt(p, viewSide()); }
function costOf(p) { return costOfAt(p, viewSide()); }
function welfareOf(p) { return welfareOfAt(p, viewSide()); }

/* ---------- 计算 ---------- */
function calcOrderAt(oid, side) {
  var o = state.orders[oid];
  var t = { qty: 0, list: 0, cost: 0, welfare: 0 };
  if (!o) return t;
  o.rows.forEach(function (r) {
    var p = findProduct(r.name, r.spec);
    var q = num(r.qty);
    t.qty += q;
    t.list += q * priceOfAt(p, side);
    t.cost += q * costOfAt(p, side);
    t.welfare += q * welfareOfAt(p, side);
  });
  return t;
}
function calcOrder(oid) { return calcOrderAt(oid, viewSide()); }
function blockByName(bname) {
  var block = null;
  state.blocks.forEach(function (b) { if (b.name === bname) block = b; });
  return block;
}
/* 一列面价侧的整套汇总计算；批发系数 ws>0 才出批发价，零售折扣 rt>0 才出零售价 */
function calcSide(block, side, ws, rt) {
  var n = block ? block.orders.length : 0;
  var sum = { qty: 0, list: 0, cost: 0, welfare: 0 };
  (block ? block.orders : []).forEach(function (oid) {
    var t = calcOrderAt(oid, side);
    sum.qty += t.qty; sum.list += t.list; sum.cost += t.cost; sum.welfare += t.welfare;
  });
  var wsOn = ws > 0, rtOn = rt > 0;
  var avgList = n ? sum.list / n : 0;
  var wholesale = wsOn ? avgList / ws : 0;
  var retail = rtOn ? avgList * rt : 0;
  var avgCost = n ? sum.cost / n : 0;
  return {
    n: n, sum: sum,
    avgList: avgList, wholesale: wholesale, retail: retail,
    dealerProfit: (wsOn && rtOn) ? retail - wholesale : 0,
    avgCost: avgCost,
    welfareTotal: sum.welfare, welfareAvg: n ? sum.welfare / n : 0,
    agentProfit: wsOn ? wholesale - avgCost : 0
  };
}

/* ---------- 导出 ---------- */
function download(filename, content, mime) {
  var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}
function csvCell(v) {

}

    rows.push(['实际零售价', rA.retail.toFixed(2), rB.retail.toFixed(2), (rA.retail - rB.retail).toFixed(2)]);
    rows.push(['经销商利润', rA.dealerProfit.toFixed(2), rB.dealerProfit.toFixed(2), (rA.dealerProfit - rB.dealerProfit).toFixed(2)]);
    rows.push(['水工福利（汇总÷套数）', rA.welfareAvg.toFixed(2), rB.welfareAvg.toFixed(2), (rA.welfareAvg - rB.welfareAvg).toFixed(2)]);
    rows.push(['']);
  });
  rows.push(['参数：列1批发系数', gp.ws1]);
  rows.push(['参数：列1零售折扣', gp.rt1]);
  rows.push(['参数：列2批发系数', gp.ws2]);
  rows.push(['参数：列2零售折扣', gp.rt2]);
  download('价格汇总-' + today() + '.csv', toCsv(rows), 'text/csv;charset=utf-8');
}
function exportOrders() {
  var rows = [['区块', '户型', '行号', '商品名称', '规格', '数量', '单位', '面价单价', '面价小计', '水工福利小计']];
  state.blocks.forEach(function (b) {
    b.orders.forEach(function (oid) {
      state.orders[oid].rows.forEach(function (r, i) {
        var p = findProduct(r.name, r.spec);
        var q = num(r.qty);
        rows.push([b.name, oid, i + 1, r.name, r.spec, q, p ? p.unit : '',
          priceOf(p).toFixed(2), (q * priceOf(p)).toFixed(2), (q * welfareOf(p)).toFixed(2)]);
      });
    });
  });
  download('户型明细-' + today() + '.csv', toCsv(rows), 'text/csv;charset=utf-8');
}

/* ---------- 事件：点击 ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t) return;
  var act = t.getAttribute('data-act');
  if (act === 'tab') { state.view.tab = t.getAttribute('data-tab'); save(); renderApp(); }
  else if (act === 'order') { state.view.order = t.getAttribute('data-oid'); state.view.tab = 'orders'; save(); renderApp(); }
  else if (act === 'add-order') {
    var bn = t.getAttribute('data-block');
    var name = prompt('新户型名称（例如：双卫6）：');
    if (!name) return;
    name = name.trim();
    if (!name) return;
    if (state.orders[name]) { alert('该户型名已存在'); return; }
    state.orders[name] = { rows: [] };
    state.blocks.forEach(function (b) { if (b.name === bn) b.orders.push(name); });
    state.view.order = name;
    save(); renderApp();
  }
  else if (act === 'rename-order') {
    var old = t.getAttribute('data-oid');
    var nn = prompt('新的户型名称：', old);
    if (!nn) return;
    nn = nn.trim();
    if (!nn || nn === old) return;
    if (state.orders[nn]) { alert('该户型名已存在'); return; }
    state.blocks.forEach(function (b) {
      var i = b.orders.indexOf(old);
      if (i >= 0) b.orders[i] = nn;
    });
    state.orders[nn] = state.orders[old];
    delete state.orders[old];
    if (state.view.order === old) state.view.order = nn;
    save(); renderApp();
  }
  else if (act === 'del-order') {
    var dn = t.getAttribute('data-oid');
    if (!confirm('确定删除户型「' + dn + '」？')) return;
    delete state.orders[dn];
    state.blocks.forEach(function (b) {
      var i = b.orders.indexOf(dn);
      if (i >= 0) b.orders.splice(i, 1);
    });
    if (state.view.order === dn) {
      var f = null;
      for (var k in state.orders) { if (!f) f = k; }
      state.view.order = f;
    }
    save(); renderApp();
  }
  else if (act === 'add-block') {
    var bname = prompt('新区块名称（例如：三卫）：');
    if (!bname) return;
    bname = bname.trim();
    if (!bname) return;
    var dup = state.blocks.some(function (b) { return b.name === bname; });
    if (dup) { alert('该区块已存在'); return; }
    state.blocks.push({ name: bname, orders: [] });
    save(); renderApp();
  }
  else if (act === 'add-row') {
    state.orders[t.getAttribute('data-oid')].rows.push({ name: '', spec: '', qty: 0 });
    save(); renderApp();
  }
  else if (act === 'del-row') {
    var oid2 = t.getAttribute('data-oid');
    state.orders[oid2].rows.splice(+t.getAttribute('data-idx'), 1);
    save(); renderApp();
  }
  else if (act === 'add-product') {
    var pn = prompt('商品名称：'); if (!pn) return;
    var ps = prompt('规格：'); if (ps == null) return;
    var pu = prompt('单位（如：个 / 条）：'); if (pu == null) return;
    state.products.push({
      name: pn.trim(), spec: ps.trim(), unit: pu.trim(),
      price: state.priceCols.map(function () { return 0; }),
      cost: state.costCols.map(function () { return 0; }),
      welfare: state.welfareCols.map(function () { return 0; })
    });
    invalidateIndex(); save(); renderApp();
  }
  else if (act === 'del-product') {
    var dpi = +t.getAttribute('data-pidx');
    var dp = state.products[dpi];
    if (!confirm('确定删除产品「' + dp.name + ' ' + dp.spec + '」？引用它的订单行将显示为未匹配。')) return;
    state.products.splice(dpi, 1);
    invalidateIndex(); save(); renderApp();
  }
  else if (act === 'add-col') {
    var bk = t.getAttribute('data-book');
    var cn = prompt('新列名称（例如：2026春季面价）：');
    if (!cn) return;
    cn = cn.trim();
    if (bk === 'price') { state.priceCols.push(cn); state.products.forEach(function (p) { p.price.push(0); }); }
    else if (bk === 'cost') { state.costCols.push(cn); state.products.forEach(function (p) { p.cost.push(0); }); }
    else { state.welfareCols.push(cn); state.products.forEach(function (p) { p.welfare.push(0); }); }
    save(); renderApp();
  }
  else if (act === 'del-col') {
    var bk2 = t.getAttribute('data-book');
    var ci2 = +t.getAttribute('data-idx');
    var colName = bk2 === 'price' ? state.priceCols[ci2] : bk2 === 'cost' ? state.costCols[ci2] : state.welfareCols[ci2];
    if (!confirm('确定删除列「' + colName + '」及其所有数值？')) return;
    if (bk2 === 'price') { if (state.priceCols.length <= 1) { alert('至少保留一列'); return; } state.priceCols.splice(ci2, 1); state.products.forEach(function (p) { p.price.splice(ci2, 1); }); }
    else if (bk2 === 'cost') { if (state.costCols.length <= 1) { alert('至少保留一列'); return; } state.costCols.splice(ci2, 1); state.products.forEach(function (p) { p.cost.splice(ci2, 1); }); }
    else { if (state.welfareCols.length <= 1) { alert('至少保留一列'); return; } state.welfareCols.splice(ci2, 1); state.products.forEach(function (p) { p.welfare.splice(ci2, 1); }); }
    save(); renderApp();
  }
  else if (act === 'print') { window.print(); }
  else if (act === 'export-summary') { exportSummary(); }
  else if (act === 'export-orders') { exportOrders(); }
  else if (act === 'backup') {
    download('价格核算备份-' + today() + '.json', JSON.stringify(state), 'application/json');
  }
  else if (act === 'import') { document.getElementById('importFile').click(); }
  else if (act === 'reset') {
    if (!confirm('确定恢复初始数据？你修改过的价格、订单、参数都会清空！')) return;
    localStorage.removeItem(LSKEY);
    state = deepCopy(SEED);
    invalidateIndex(); save(); renderApp();
  }
});

/* ---------- 事件：修改 ---------- */
document.addEventListener('change', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute) return;
  var act = t.getAttribute('data-act');
  if (act === 'row-product') {
    var oid = t.getAttribute('data-oid');
    var idx = +t.getAttribute('data-idx');
    var k = t.value;
    var parts = k.split('|');
    var r = state.orders[oid].rows[idx];
    r.name = parts.shift() || '';
    r.spec = parts.join('|');
    save(); renderApp();
  }
  else if (act === 'set-col') {
    var bk = t.getAttribute('data-book');
    if (bk === 'price') state.view.priceCol = t.value;
    else if (bk === 'price2') state.view.priceCol2 = t.value;
    else state.view[bk + 'Col'] = t.value;
    save(); renderApp();
  }
  else if (act === 'sel-order') {
    state.view.order = t.value; save(); renderApp();
  }
  else if (act === 'book-cell') {
    var p = state.products[+t.getAttribute('data-pidx')];
    if (p) {
      p[t.getAttribute('data-book')][+t.getAttribute('data-idx')] = num(t.value);
      save();
    }
  }
  else if (act === 'book-text') {
    var p2 = state.products[+t.getAttribute('data-pidx')];
    if (p2) {
      p2[t.getAttribute('data-field')] = t.value;
      invalidateIndex(); save();
    }
  }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute) return;
  var act = t.getAttribute('data-act');
  if (act === 'row-qty') {
    var oid = t.getAttribute('data-oid');
    var idx = +t.getAttribute('data-idx');
    state.orders[oid].rows[idx].qty = num(t.value);
    save();
    updateOrderNumbers(oid, idx);
  }
  else if (act === 'gparam') {
    if (!state.gparams) state.gparams = { ws1: '', rt1: '', ws2: '', rt2: '' };
    state.gparams[t.getAttribute('data-field')] = t.value;
    save();
    if (state.view.tab === 'summary') state.blocks.forEach(function (b) { updateBlockNumbers(b.name); });
  }
  else if (act === 'logout') { doLogout(); }
});

/* ---------- 导入文件 ---------- */
document.getElementById('importFile').addEventListener('change', function () {
  var f = this.files[0];
  this.value = '';
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var obj = JSON.parse(reader.result);
      if (!obj || !obj.products || !obj.orders || !obj.blocks || !obj.priceCols) throw new Error('格式不对');
      state = obj;
      invalidateIndex(); save(); renderApp();
      alert('导入成功');
    } catch (err) {
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(f, 'utf-8');
});

/* ---------- 登录 ---------- */
var AUTH_HASH = '7bc1df19ea121afa87d3574d4c31b254a00fd3f6e28dc3bd661dd675c08a4ddc'; /* SHA-256(账号|密码) */
/* SHA-256（同步版，用于登录哈希校验） */
function sha256Hex(str) {
  function rr(v, n) { return (v >>> n) | (v << (32 - n)); }
  var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes = [];
  for (var i = 0; i < str.length; i++) {
    var c = str.charCodeAt(i);
    if (c < 0x80) bytes.push(c);
    else if (c < 0x800) bytes.push(0xc0 | (c >> 6), 0x80 | (c & 63));
    else if (c >= 0xd800 && c <= 0xdbff && i + 1 < str.length) {
      var c2 = str.charCodeAt(++i);
      c = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
      bytes.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    } else bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  var bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (var j = 7; j >= 0; j--) bytes.push(Math.floor(bitLen / Math.pow(2, j * 8)) & 0xff);
  for (var off = 0; off < bytes.length; off += 64) {
    var w = new Array(64);
    for (var t = 0; t < 16; t++) w[t] = (bytes[off + t*4] << 24) | (bytes[off + t*4+1] << 16) | (bytes[off + t*4+2] << 8) | bytes[off + t*4+3];
    for (var t2 = 16; t2 < 64; t2++) {
      var s0 = rr(w[t2-15],7) ^ rr(w[t2-15],18) ^ (w[t2-15] >>> 3);
      var s1 = rr(w[t2-2],17) ^ rr(w[t2-2],19) ^ (w[t2-2] >>> 10);
      w[t2] = (w[t2-16] + s0 + w[t2-7] + s1) | 0;
    }
    var a=H[0],b=H[1],cc=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (var t3 = 0; t3 < 64; t3++) {
      var S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
      var ch = (e & f) ^ (~e & g);
      var t1 = (h + S1 + ch + K[t3] + w[t3]) | 0;
      var S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22);
      var maj = (a & b) ^ (a & cc) ^ (b & cc);
      var t2v = (S0 + maj) | 0;
      h=g; g=f; f=e; e=(d+t1)|0; d=cc; cc=b; b=a; a=(t1+t2v)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+cc)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  var hex = '';
  for (var k = 0; k < 8; k++) hex += ('00000000' + ((H[k] >>> 0).toString(16))).slice(-8);
  return hex;
}
function isLoggedIn() { return sessionStorage.getItem('rf_login_ok_dist') === '1'; }
function showLogin() { document.getElementById('loginMask').style.display = 'flex'; }
function hideLogin() { document.getElementById('loginMask').style.display = 'none'; }
function doLogin() {
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPass').value;
  if (sha256Hex(u + '|' + p) === AUTH_HASH) {
    sessionStorage.setItem('rf_login_ok_dist', '1');
    hideLogin();
    migrate();
    renderApp();
  } else {
    document.getElementById('loginErr').textContent = '账号或密码错误';
    document.getElementById('loginPass').value = '';
  }
}
function doLogout() {
  sessionStorage.removeItem('rf_login_ok_dist');
  location.reload();
}

/* ---------- 启动 ---------- */
if (isLoggedIn()) {
  migrate();
  renderApp();
} else {
  showLogin();
}
